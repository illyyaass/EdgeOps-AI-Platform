apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeops-dashboard
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: nginx
        image: ghcr.io/illyyaass/edgeops-dashboard:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: edgeops-dashboard-svc
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080