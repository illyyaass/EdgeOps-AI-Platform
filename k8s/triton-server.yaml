apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeops-triton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      containers:
      - name: triton
        image: nvcr.io/nvidia/tritonserver:23.10-py3
        command: ["tritonserver", "--model-repository=/models"]
        ports:
        - containerPort: 8000 # HTTP
        - containerPort: 8001 # GRPC
        - containerPort: 8002 # Metrics
---
apiVersion: v1
kind: Service
metadata:
  name: edgeops-triton-svc
spec:
  type: ClusterIP
  selector:
    app: triton
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  - port: 8001
    targetPort: 8001
    name: grpc